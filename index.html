<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 20/10 - 12A11</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b0b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Màn hình chờ (Bắt buộc click để phát nhạc theo chính sách trình duyệt) */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 11, 20, 0.96);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        /* Hai ô vuông phát sáng giống video */
        .glow-boxes {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }
        .box {
            width: 65px;
            height: 65px;
            background: #00ffff;
            border-radius: 16px;
            box-shadow: 0 0 25px #00ffff, inset 0 0 12px rgba(255,255,255,0.8);
            animation: pulseBox 1.5s infinite alternate;
        }
        .box:nth-child(2) {
            animation-delay: 0.75s;
        }
        @keyframes pulseBox {
            0% { transform: scale(1); opacity: 0.7; box-shadow: 0 0 10px #00ffff; }
            100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 30px #00ffff; }
        }

        #start-screen h2 {
            color: #00ffff;
            font-size: 22px;
            margin-bottom: 25px;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
        }

        .start-btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4);
            transition: 0.3s;
            font-weight: bold;
        }
        .start-btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 25px #00ffff;
        }

        /* Giao diện chính khi đã vào web */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        #lyrics-container {
            font-size: 24px;
            color: #fff;
            line-height: 1.6;
            text-shadow: 0 0 12px rgba(255,255,255,0.7);
            min-height: 80px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Hiệu ứng hạt sáng bay nền */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: floatUp linear infinite;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Màn hình chờ click -->
    <div id="start-screen" onclick="startWeb()">
        <div class="glow-boxes">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <h2>Hôm nay tớ nhận lệnh từ các bạn nam 12a11 là để...</h2>
        <button class="start-btn">Nhấn để xem 🌸</button>
    </div>

    <!-- Nội dung hiển thị lyric -->
    <div class="main-content">
        <div class="glow-boxes" style="margin-bottom: 35px;">
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div id="lyrics-container">Chuẩn bị...</div>
    </div>

    <!-- Nhạc nền -->
    <audio id="bg-music" src="https://www.bensound.com/bensound-music/bensound-cute.mp3" preload="auto"></audio>

    <script>
        // Danh sách lời bài hát khớp thời gian (tính bằng giây)
        const lyrics = [
            { time: 0, text: "Hôm nay tớ nhận lệnh từ các bạn nam 12a11 là để..." },
            { time: 3, text: "Ui các cậu đẹp quá..." },
            { time: 7, text: "À thì cũng sắp 20/10 rồi..." },
            { time: 12, text: "Nên là tớ muốn..." },
            { time: 17, text: "Chúc các cậu thật nhiều sức khỏe..." },
            { time: 21, text: "Chúc các cậu thật xinh đẹp..." },
            { time: 26, text: "Và chúc các cậu luôn giữ nụ cười trên môi! 💕" }
        ];

        const audio = document.getElementById('bg-music');
        const lyricsContainer = document.getElementById('lyrics-container');
        const startScreen = document.getElementById('start-screen');
        let isStarted = false;

        function startWeb() {
            if (isStarted) return;
            isStarted = true;

            // Ẩn màn hình chờ mượt mà
            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
            }, 500);

            // Phát nhạc
            audio.play().catch(err => {
                console.log("Trình duyệt chặn phát tự động:", err);
            });

            // Chạy hiệu ứng hạt bay
            startParticles();

            // Đồng hồ đếm thời gian nhạc để đổi chữ tương ứng
            audio.addEventListener('timeupdate', () => {
                let currentTime = audio.currentTime;
                let currentText = "";
                
                for (let i = 0; i < lyrics.length; i++) {
                    if (currentTime >= lyrics[i].time) {
                        currentText = lyrics[i].text;
                    }
                }
                if (currentText) {
                    lyricsContainer.innerHTML = currentText;
                }
            });
        }

        function startParticles() {
            setInterval(() => {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.style.left = Math.random() * window.innerWidth + 'px';
                p.style.width = Math.random() * 5 + 2 + 'px';
                p.style.height = p.style.width;
                p.style.animationDuration = (Math.random() * 3 + 3) + 's';
                document.body.appendChild(p);

                setTimeout(() => {
                    p.remove();
                }, 6000);
            }, 250);
        }
    </script>
</body>
</html>
